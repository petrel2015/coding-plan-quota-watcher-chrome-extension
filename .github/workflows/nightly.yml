# Nightly 构建：每日定时（可手动/按 tag 触发）跑测试 → 构建 → 打包 zip → 上传为 Artifact
# 产物在 Actions 运行页底部下载；manifest 版本号保持仓库当前版本
# （MV3 的 version 只允许点分整数，不能带 nightly 后缀，日期/SHA 体现在文件名里）
#
# 触发方式：
#   - 定时：UTC 18:00（北京时间次日 02:00），构建 main 当前状态
#   - 手动：gh workflow run nightly-build                     → 构建 main
#            gh workflow run nightly-build --ref v1.13.5      → 构建指定 tag
name: nightly-build

on:
  schedule:
    # UTC 18:00 = 北京时间次日 02:00
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 测试（门禁）
        run: npm test

      - name: 构建并打包
        run: npm run package

      - name: 命名产物（tag 构建用 tag 名，分支构建用 nightly+日期）
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VER=$(node -p "require('./package.json').version")
          DATE=$(date -u +%Y%m%d)
          SHA=$(git rev-parse --short HEAD)
          mkdir -p nightly
          if [ "$REF_TYPE" = "tag" ]; then
            NAME="coding-plan-quota-watcher-${VER}-${SHA}.zip"
          else
            NAME="coding-plan-quota-watcher-${VER}-nightly-${DATE}-${SHA}.zip"
          fi
          mv "releases/coding-plan-quota-watcher-${VER}.zip" "nightly/${NAME}"
          echo "BUILD_NAME=${NAME%.zip}" >> "$GITHUB_ENV"
          ls -la nightly/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}
          path: nightly/*.zip
          retention-days: 30
          if-no-files-found: error
